[package]
name = "whisker-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native macOS Host for Whisker applications."

[dependencies]
whisker = { workspace = true }
whisker-engine = { workspace = true }
whisker-protocol = { workspace = true }
whisker-style = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
csscolorparser = "0.7.2"
glyphon = "0.9.0"
pollster = "0.4.0"
wgpu = { version = "25.0.2", default-features = false, features = ["metal", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
