[package]
name = "whisker-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared native Desktop Host for Whisker applications."

[dependencies]
whisker = { workspace = true }
whisker-engine = { workspace = true }
whisker-protocol = { workspace = true }
whisker-style = { workspace = true }
whisker-value = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
csscolorparser = "0.7.2"
glyphon = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "25.0.2", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "25.0.2", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "25.0.2", default-features = false, features = ["vulkan", "gles", "wgsl"] }

[dev-dependencies]
pollster = "0.4.0"
serde_json = "1"
whisker-host-conformance = { workspace = true }
