[package]
name = "whisker-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Browser DOM Host for Whisker applications."

[features]
default = []
hot-reload = [
    "whisker/hot-reload",
    "dep:serde",
    "dep:serde_json",
    "dep:subsecond",
    "dep:subsecond-types",
]

[dependencies]
whisker = { workspace = true }
whisker-engine = { workspace = true }
whisker-protocol = { workspace = true }
whisker-style = { workspace = true }
whisker-value = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
subsecond = { workspace = true, optional = true }
subsecond-types = { workspace = true, optional = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "css",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "Document",
    "DocumentFragment",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "ImageData",
    "Node",
    "Performance",
    "PointerEvent",
    "ScrollBehavior",
    "ScrollToOptions",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "SvgElement",
    "Url",
    "Window",
] }

[dev-dependencies]
base64 = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen-test = "0.3"
whisker-host-conformance = { workspace = true }
