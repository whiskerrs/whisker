[package]
name = "whisker-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Browser DOM Host for Whisker applications."

[dependencies]
whisker = { workspace = true }
whisker-engine = { workspace = true }
whisker-protocol = { workspace = true }
whisker-style = { workspace = true }
whisker-value = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Performance",
    "Window",
] }

[dev-dependencies]
serde_json = { workspace = true }
wasm-bindgen-test = "0.3"
whisker-host-conformance = { workspace = true }
