[package]
name = "whisker-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native WinUI 3 Windows Host for Whisker."
# Exposes the Whisker.WindowsHost headers to C++ module builds as DEP_WHISKER_WINDOWS_INCLUDE.
links = "whisker-windows"
exclude = ["host"]

[features]
hot-reload = ["whisker/hot-reload"]

[target.'cfg(target_os = "windows")'.dependencies]
whisker = { workspace = true }
