[package]
name = "whisker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cross-platform native UI framework with a shared Rust runtime."

[features]
default = []
# Enables subsecond-backed hot reload.
# `whisker run` flips this on; release builds leave it off. Pulls in
# `subsecond` here too so the `#[whisker::main]` macro can wrap the
# user's app fn with `subsecond::call(|| user_app())` *inside the
# user crate*. The wrapper closure has to live in the user crate
# (not in whisker-driver) so the JumpTable that links host symbols to
# patch symbols actually contains its `call_it` monomorphization on
# both sides — otherwise subsecond can't dispatch to the patched
# version.
hot-reload = ["dep:subsecond", "whisker-driver/hot-reload"]
# Hosts a process-lifetime tokio runtime so tokio-based async libraries
# (reqwest, etc.) work inside `resource()`/`spawn_local()`.
# Off by default; tokio drops out of release builds when unused.
tokio = ["dep:tokio"]

[dependencies]
whisker-runtime = { workspace = true }
whisker-animation = { workspace = true }
whisker-macros = { workspace = true }
whisker-config = { workspace = true }
whisker-css = { workspace = true }
whisker-engine = { workspace = true }
whisker-value = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
subsecond = { workspace = true, optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
whisker-driver = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "time", "net", "io-util"] }
