[package]
name = "whisker-dev-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Development-only runtime: WebSocket client + hot-reload patch receiver."

[features]
default = []
auth = ["dep:hmac", "dep:sha2", "dep:serde", "dep:serde_json"]
# Pulls in the WebSocket client + subsecond bindings. Mobile enables it
# through `whisker-driver`; Desktop enables it directly. Release builds get
# an empty crate.
hot-reload = [
    "auth",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:subsecond",
    "dep:subsecond-types",
    "dep:libc",
]

[dependencies]
whisker-runtime = { workspace = true }

# Hot-reload-only — every dep below disappears from release builds.
tokio = { workspace = true, optional = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { workspace = true, optional = true, features = ["connect"] }
futures-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
subsecond = { workspace = true, optional = true }
subsecond-types = { workspace = true, optional = true }
# `pipe(2)` / `dup2` / `read` / `STDOUT_FILENO` for POSIX log capture.
# Windows keeps hot reload enabled but currently leaves log forwarding off.
libc = { workspace = true, optional = true }

hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
