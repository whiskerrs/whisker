name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Rust workspace version (e.g. 0.13.4)
        required: true
      sdk_version:
        description: Android SDK version (blank to reuse the current SDK)
      gradle_version:
        description: Gradle plugin version (blank to reuse the current plugin)
      ios_version:
        description: SwiftPM version (blank to reuse the current SDK)
      subsecond_version:
        description: Fork crate version (only when whisker-subsecond changes)
  push:
    branches: [main]
    paths: ['.github/release.json']

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

# Only release-plan merges enter the publishing queue; ordinary main pushes
# cannot replace a pending release. Preparation has its own queue.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare one release PR
    if: github.event_name == 'workflow_dispatch' && github.repository == 'whiskerrs/whisker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Update versions, pins and release notes; open PR and run CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          GRADLE_VERSION: ${{ inputs.gradle_version }}
          IOS_VERSION: ${{ inputs.ios_version }}
          SUBSECOND_VERSION: ${{ inputs.subsecond_version }}
        run: cargo xtask release prepare

  plan:
    name: Read merged release plan
    if: github.event_name == 'push' && github.repository == 'whiskerrs/whisker'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sdk: ${{ steps.plan.outputs.sdk }}
      gradle: ${{ steps.plan.outputs.gradle }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - id: plan
        run: cargo xtask release plan

  android-sdk:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.sdk != ''
    uses: ./.github/workflows/publish-sdk.yml
    with:
      version: ${{ needs.plan.outputs.sdk }}
      publish: true
    secrets: inherit

  gradle-plugin:
    needs: [plan, android-sdk]
    if: >-
      !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.gradle != '' &&
      (needs.android-sdk.result == 'success' || needs.android-sdk.result == 'skipped')
    uses: ./.github/workflows/publish-gradle-plugin.yml
    with:
      version: ${{ needs.plan.outputs.gradle }}
      publish: true
    secrets: inherit

  swiftpm:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.ios != ''
    uses: ./.github/workflows/publish-ios.yml
    with:
      version: ${{ needs.plan.outputs.ios }}
      publish: true
    secrets: inherit

  crates:
    name: Publish Rust and one GitHub Release
    needs: [plan, android-sdk, gradle-plugin, swiftpm]
    if: >-
      !cancelled() && needs.plan.outputs.release == 'true' &&
      (needs.android-sdk.result == 'success' || needs.android-sdk.result == 'skipped') &&
      (needs.gradle-plugin.result == 'success' || needs.gradle-plugin.result == 'skipped') &&
      (needs.swiftpm.result == 'success' || needs.swiftpm.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Resume unpublished crates and finalize the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo xtask release publish
