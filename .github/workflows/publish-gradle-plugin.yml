name: publish-gradle-plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Gradle plugin smoke-build version
        default: '0.0.0-dev'
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release version and immutable tag
        id: check
        if: inputs.publish
        run: cargo xtask release native-check gradle "$VERSION"
      - name: Stamp both plugin versions
        if: steps.check.outputs.published != 'true'
        run: cargo xtask release native-stamp gradle "$VERSION"
      - name: Stage both Gradle plugins and their markers
        if: steps.check.outputs.published != 'true'
        working-directory: platforms/android/gradle-plugin
        run: ./gradlew --no-daemon publishAllPublicationsToGhPagesRepository -PpublishUrl="file://${{ github.workspace }}/maven-out"
      - uses: actions/upload-artifact@v4
        if: '!inputs.publish'
        with:
          name: gradle-maven
          path: maven-out/**
      - name: Tag built plugins
        if: inputs.publish && steps.check.outputs.published != 'true'
        run: cargo xtask release native-tag gradle "$VERSION"
      - name: Publish Maven artifacts
        if: inputs.publish && steps.check.outputs.published != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: maven-out
          destination_dir: maven
          keep_files: true
          commit_message: publish Gradle plugin ${{ inputs.version }}
      - name: Request Pages deployment
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify public Maven artifacts
        if: inputs.publish
        run: cargo xtask release native-verify gradle "$VERSION"
