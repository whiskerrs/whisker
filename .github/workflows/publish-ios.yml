name: publish-ios

# SwiftPM consumes the tag itself: compile before exposing it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SwiftPM version to verify (must match source pins)
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-ios
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Check every SwiftPM pin and immutable tag
        id: check
        if: inputs.publish
        run: cargo xtask release native-check ios "$VERSION"
      - name: Check smoke-build pins
        if: '!inputs.publish'
        run: cargo xtask release native-pins ios "$VERSION"
      - name: Build the public Swift package
        if: steps.check.outputs.published != 'true'
        run: xcodebuild -scheme WhiskerRuntime -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build
      - name: Tag verified Swift package
        if: inputs.publish
        run: cargo xtask release native-tag ios "$VERSION"
