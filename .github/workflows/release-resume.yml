name: release-resume

# A re-run uses the failed run's job definitions, so a publish job that needs a
# workflow fix resumes here from its release-plan commit instead.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Release-plan merge commit whose Rust publication to resume
        required: true

permissions:
  contents: write

concurrency:
  group: release-push
  cancel-in-progress: false

jobs:
  crates:
    name: Publish Rust and one GitHub Release
    if: github.repository == 'whiskerrs/whisker'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: bash .github/scripts/install-ubuntu-packages.sh libfontconfig1-dev libgtk-4-dev
      - name: Resume unpublished crates and finalize the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo xtask release publish
