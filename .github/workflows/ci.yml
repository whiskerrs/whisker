name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref so a rapid `git push` series
# doesn't pile up jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan renderer
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: cargo test --workspace --all-targets
        env:
          RUST_TEST_THREADS: 1
          WGPU_BACKEND: vulkan
      - run: cargo test --workspace --doc

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rustdoc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace library documentation
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

  mobile-abi:
    name: Mobile ABI source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask mobile-abi check
      - name: Compile generated C and C++ interfaces
        run: |
          clang -std=c11 -pedantic-errors -fsyntax-only \
            -include crates/whisker-driver-sys/bridge/include/whisker_mobile.h \
            -x c /dev/null
          clang++ -std=c++17 -pedantic-errors -fsyntax-only \
            -include crates/whisker-driver-sys/bridge/include/whisker_mobile.h \
            -x c++ /dev/null
      - run: cargo test -p whisker-driver-sys -p whisker-driver

  mobile-link-test-android:
    name: Mobile consumer link (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"
      - name: Build and inspect generated Android consumer
        run: cargo xtask mobile-link-test android
        # Cross-target feature flags can emit rustc's own compatibility
        # warnings. The regular clippy job remains the source warning gate.
        env:
          RUSTFLAGS: ""

  mobile-link-test-ios:
    name: Mobile consumer link (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build and inspect generated iOS consumer
        run: cargo xtask mobile-link-test ios
        # Cross-target feature flags can emit rustc's own compatibility
        # warnings. The regular clippy job remains the source warning gate.
        env:
          RUSTFLAGS: ""

  msrv:
    name: MSRV (rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version here must match `rust-version` in the root
      # Cargo.toml's `[workspace.package]`. If you bump one, bump both.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo deny (advisories / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `licenses` is intentionally omitted until the allow-list in
          # deny.toml is confirmed against every transitive dep; the
          # other three are the security-relevant gates.
          command: check advisories bans sources

  host-conformance-desktop:
    name: Host conformance (Desktop / wgpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan renderer
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: cargo xtask host-conformance desktop
        env:
          WGPU_BACKEND: vulkan

  host-conformance-web:
    name: Host conformance (Web / Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo xtask host-conformance web
      - run: cargo xtask rust-host-link-test web

  rust-host-link-test-desktop:
    name: Rust Host module link (Desktop)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask rust-host-link-test desktop

  host-conformance-android:
    name: Host conformance (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7_pro
          script: cargo xtask host-conformance android

  host-conformance-ios:
    name: Host conformance (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask host-conformance ios

  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    permissions:
      # `permissions:` is a *whitelist*: any scope not listed is
      # revoked from `GITHUB_TOKEN`. `actions/checkout` needs
      # `contents: read` to clone the repo — private repos respond 404
      # to unauthenticated fetches, which surfaces as
      # "Repository not found" (the symptom we hit before this line
      # was here).
      contents: read
      # Required for the PR-comment step to post on pull requests
      # opened from forks. Plain push events ignore this.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install software Vulkan renderer
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Generate coverage
        # `--doctests` is nightly-only; stable runs doctest-free coverage.
        # Produce LCOV (for the artifact / editor integrations) and a
        # human-readable summary in one pass.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
        env:
          RUST_TEST_THREADS: 1
          WGPU_BACKEND: vulkan

      - name: Enforce coverage for the new Rust renderer foundation
        # Legacy crates are raised incrementally as they move onto the new
        # engine. New Host-independent foundation crates start at the strict
        # gate and must keep line, function, and region coverage at 100%.
        run: |
          for package in whisker-protocol whisker-engine whisker-style whisker-layout; do
            cargo llvm-cov -p "$package" --summary-only \
              --fail-under-lines 100 \
              --fail-under-functions 100 \
              --fail-under-regions 100
          done

      - name: Render Markdown summary
        # cargo-llvm-cov's summary is a wide fixed-width table; wrap it
        # in a Markdown fenced block so both the Job Summary and PR
        # comment render with the columns intact.
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } > coverage.md

      - name: Append to Job Summary
        # Renders inside the run's "Summary" tab — visible to anyone
        # with read access, no external SaaS, no token.
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update PR comment
        # Only on pull_request events. The sticky comment is updated in
        # place on subsequent pushes to the same PR.
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md

      - name: Archive LCOV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 14
