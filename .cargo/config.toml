[alias]
xtask = "run --package xtask --"
# `cargo coverage` → HTML report opened in the browser.
# Requires `cargo install cargo-llvm-cov` and `rustup component add
# llvm-tools-preview` once. `--doctests` is nightly-only so we leave
# doctests uninstrumented for now.
coverage = "llvm-cov --workspace --html --open"
# `cargo coverage-text` → terminal summary.
coverage-text = "llvm-cov --workspace"
# `cargo coverage-lcov` → LCOV for CI consumption.
coverage-lcov = "llvm-cov --workspace --lcov --output-path lcov.info"

[resolver]
# Keep lockfile refreshes on releases compatible with the workspace MSRV.
# The dedicated 1.85 CI job still verifies source-level compatibility.
incompatible-rust-versions = "fallback"

[target.aarch64-linux-android]
# Keep the target at its default Armv8.0 baseline. Current Rust emits
# classic `ldxr`/`stxr` loops for atomics on `aarch64-linux-android`,
# which every `arm64-v8a` device can execute. Do not explicitly disable
# the internal `outline-atomics` target feature: it is not part of
# Rust's stable target-feature surface and produces a warning on every
# crate with current toolchains.
#
# Do NOT add `+lse` here (nor `-march=armv8.1-a` on the C++ side): it
# inlines Armv8.1 `ldadd`/`cas`, and `arm64-v8a` is an Armv8.0
# baseline, so pre-8.1 devices hit an undefined instruction and die
# with SIGILL on the first atomic.
#
# `max-page-size=16384` aligns ELF LOAD segments to 16 KB pages so
# the `.so` works on devices that boot with 16 KB pages. Pixel
# emulators with Android 15+ default to 16 KB; without this flag,
# the dynamic linker rejects the library with "page boundary not
# 16K aligned". NDK r27+ flips the default to 16 KB and the flag
# becomes redundant — remove this line once we drop NDK r26
# support.
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]
