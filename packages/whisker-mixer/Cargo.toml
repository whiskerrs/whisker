[package]
name = "whisker-mixer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Low-latency sound for Whisker apps and games: buses, effects, synthesized voices, and an audio clock. Web Audio on the Web; native platforms are silent for now."

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioListener",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "ConvolverNode",
    "Document",
    "DynamicsCompressorNode",
    "EventTarget",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "PannerNode",
    "PanningModelType",
    "Response",
    "VisibilityState",
    "Window",
    "console",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
