[package]
name = "whisker-paths-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example app for `whisker-paths`. On launch it resolves all four per-app directories, writes and reads back a file under the cache dir, and shows each result, so on-device verification of the module wiring happens in one place."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "whisker-config"
path = "whisker.rs"
required-features = ["whisker-config"]
test = false
bench = false

[features]
whisker-config = ["whisker-cng/generate"]

[dependencies]
whisker-cng = { path = "../../../crates/whisker-cng", version = "0.13.10", default-features = false }
whisker = { workspace = true }
whisker-paths = { path = ".." }
