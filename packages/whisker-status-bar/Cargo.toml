[package]
name = "whisker-status-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Whisker platform module — Android status-bar hide/show + content style, with no-op fallbacks on other platforms."

# Explicit `include` list — mirrors `whisker-safe-area` / `whisker-image`.
include = [
    "Cargo.toml",
    "build.gradle.kts",
    "bin/**/*.rs",
    "src/**/*.rs",
    "android/**/*.kt",
    "README.md",
]

[lib]
crate-type = ["rlib"]

# Android owns the only native implementation. iOS, Web, and Desktop keep
# source-compatible no-op behaviour entirely in this Rust crate.
[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { kind = "common" }
web = { kind = "common" }
desktop = { kind = "common" }

# Plugin registration — no-op today (Android needs no config; iOS is a
# TODO). Kept registered so `app.plugin::<WhiskerStatusBar>(|c| c)` stays
# valid and future iOS work has a home.
[package.metadata.whisker.plugins.whisker-status-bar]
bin = "whisker-status-bar-plugin"

[[bin]]
name = "whisker-status-bar-plugin"
path = "bin/whisker_status_bar_plugin.rs"
test = false
bench = false
doc = false

[dependencies]
# `whisker` gated behind the `runtime` feature so the config probe can
# pull this crate with `default-features = false` and skip the full runtime
# and Host protocol build. Default-on so app deps "just work".
whisker = { workspace = true, optional = true }
whisker-plugin = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }

[features]
default = ["runtime"]
runtime = ["dep:whisker"]
