[package]
name = "whisker-router-web"
version = "0.13.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web History API Host adapter for whisker-router."

[dependencies]
whisker = { path = "../../../crates/whisker", version = "0.13.9" }
whisker-web = { path = "../../../platforms/web", version = "0.13.9" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "EventTarget",
    "History",
    "Location",
    "PopStateEvent",
    "Window",
] }
