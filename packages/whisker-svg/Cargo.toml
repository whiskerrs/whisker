[package]
name = "whisker-svg"
version = "0.14.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Whisker SVG widget with native Android, iOS, Web, and Desktop host renderers."

# Explicit include — mirrors whisker-image / whisker-safe-area:
# `cargo publish` ships the Kotlin + Swift platform sources next to
# `src/lib.rs`, never the local Gradle / Xcode build artefacts.
include = [
    "Cargo.toml",
    "Package.swift",
    "build.gradle.kts",
    "SPEC.md",
    "src/**/*.rs",
    "android/**/*.kt",
    "android/**/*.kts",
    "ios/**/*.swift",
    "windows/**/*.cpp",
    "README.md",
]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }
macos = { manifest = "Package.swift" }
web = { manifest = "web/Cargo.toml" }
linux = { manifest = "linux/Cargo.toml" }
windows = { sources = "windows" }

[dependencies]
whisker = { path = "../../crates/whisker", version = "0.17.0" }
# Base64 for transporting display-list bytes through the existing
# string-typed Prop pipeline. `base64` is the de-facto crate
# (~10 KB compiled). The platform replayers decode with the OS
# stdlib's Base64 facility, no extra dep there.
base64 = "0.22"
# SVG XML parsing for the compiler. Disabling default-features
# drops the `xmlparser` errata-recovery path, which we don't need —
# we treat unknown tags as warnings and proceed.
roxmltree = { version = "0.20", default-features = false, features = ["std"] }
csscolorparser = { version = "0.7.2", optional = true }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"], optional = true }

[features]
# CPU rasterizer used by the Linux and Windows Hosts.
raster = ["dep:csscolorparser", "dep:tiny-skia"]
