[package]
name = "whisker-svg-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example app for visual and on-device verification of whisker-svg on Android, iOS, Web, and Desktop."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "whisker-config"
path = "whisker.rs"
required-features = ["whisker-config"]
test = false
bench = false

[features]
whisker-config = ["whisker-cng/generate"]

[dependencies]
whisker-cng = { path = "../../../crates/whisker-cng", version = "0.14.0", default-features = false }
whisker = { workspace = true }
whisker-svg = { path = ".." }
