[package]
name = "whisker-input-web"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web Host implementation for whisker-input."

[dependencies]
serde = { workspace = true }
whisker-protocol = { path = "../../../crates/whisker-protocol", version = "0.14.0" }
whisker-web = { path = "../../../platforms/web", version = "0.14.0" }
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Window",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEventInit", "Window"] }
