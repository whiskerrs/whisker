[package]
name = "whisker-surface"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native GPU render targets for Whisker elements, independent of any graphics API."

include = [
    "Cargo.toml",
    "Package.swift",
    "build.gradle.kts",
    "src/**/*.rs",
    "android/**/*.kt",
    "ios/**/*.swift",
    "windows/**/*.cpp",
    "README.md",
]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }
macos = { manifest = "Package.swift" }
web = { manifest = "web/Cargo.toml" }
linux = { manifest = "linux/Cargo.toml" }
windows = { sources = "windows" }

[dependencies]
whisker = { path = "../../crates/whisker", version = "0.19.2" }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
