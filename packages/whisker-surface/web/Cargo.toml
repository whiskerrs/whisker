[package]
name = "whisker-surface-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web Host implementation for whisker-surface."

[dependencies]
whisker-surface = { path = "..", version = "0.1.0" }
whisker-web = { path = "../../../platforms/web", version = "0.19.1" }
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "MouseEvent", "WheelEvent", "Window"] }
