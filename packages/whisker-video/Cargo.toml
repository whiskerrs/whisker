[package]
name = "whisker-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Whisker video element for Android, iOS, and Web, with imperative playback controls."

# Phase K — explicit `include` list so a `cargo publish` of this crate
# ships the Kotlin + Swift platform sources alongside `src/lib.rs`.
# By default cargo includes everything under the package dir, but
# being explicit prevents accidentally publishing local Gradle / Xcode
# build artifacts if a stale build dir lingers next to the manifest.
include = [
    "Cargo.toml",
    "Package.swift",
    "build.gradle.kts",
    "src/lib.rs",
    "android/**/*.kt",
    "ios/**/*.swift",
]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }
web = { manifest = "web/Cargo.toml" }

[dependencies]
# The umbrella `whisker` crate. Module crates and app crates depend
# on the same crate — the proc macros' emit paths (`::whisker::ElementRef`,
# `::whisker::runtime::view::Element`, `::whisker::platform_module::WhiskerValue`,
# …) resolve under the `whisker` name. A published module would write
# `whisker = "0.1"`.
whisker = { workspace = true }
