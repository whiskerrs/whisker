[package]
name = "kiba-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example app for verifying Kiba."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "whisker-config"
path = "whisker.rs"
required-features = ["whisker-config"]
test = false
bench = false

[features]
whisker-config = ["whisker-cng/generate"]
# Replaces the scene with the instance benchmark in DESIGN.md.
stress = []
# Flies across a cooked world served at /world, to measure streaming.
soak = []
# Replaces the scene with the Meshy-built world in showcase/.
showcase = []

[dependencies]
whisker-cng = { path = "../../../crates/whisker-cng", version = "0.15.0", default-features = false }
whisker = { workspace = true }
whisker-asset = { path = "../../whisker-asset" }
kiba = { path = "..", features = ["gltf"] }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = "1"
whisker-svg = { workspace = true }
