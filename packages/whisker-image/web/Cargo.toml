[package]
name = "whisker-image-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web Host implementation for whisker-image."

[dependencies]
whisker-web = { workspace = true }
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlImageElement",
    "Window",
] }
