[package]
name = "whisker-image"
version = "0.14.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Network image component for Whisker — fetches HTTP(S) URLs and renders into a native image view (Kingfisher on iOS, Coil on Android) with built-in memory + disk caching."

# Explicit `include` list — mirrors `whisker-video`. A `cargo publish`
# ships the Kotlin + Swift platform sources alongside `src/lib.rs`,
# but never the local Gradle / Xcode build artifacts that would
# accidentally bloat the published crate if a stale build dir lingers.
include = [
    "Cargo.toml",
    "Package.swift",
    "build.gradle.kts",
    "src/**/*.rs",
    "windows/**/*.cpp",
    "android/**/*.kt",
    "ios/**/*.swift",
    "README.md",
]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }
macos = { manifest = "Package.swift" }
web = { manifest = "web/Cargo.toml" }
linux = { manifest = "linux/Cargo.toml" }
windows = { sources = "windows" }

[dependencies]
whisker = { path = "../../crates/whisker", version = "0.17.0" }
# Event payloads cross as JSON bodies; `bind_typed` deserialises them.
serde = { workspace = true, features = ["derive"] }
base64 = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
lru = { version = "0.18.2", optional = true }
serde_json = { workspace = true, optional = true }
ureq = { version = "2.12", optional = true }

[features]
# Fetch/decode/fit pipeline used by the Hosts that draw images themselves.
loader = ["dep:base64", "dep:image", "dep:lru", "dep:serde_json", "dep:ureq"]
