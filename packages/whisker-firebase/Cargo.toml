[package]
name = "whisker-firebase"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Firebase integration and project configuration for Whisker"
include = ["Cargo.toml", "src/**", "bin/**", "README.md"]

[lib]
crate-type = ["rlib"]

[features]
default = []
firestore = ["dep:whisker-firebase-firestore"]
auth = ["dep:whisker-firebase-auth"]
storage = ["dep:whisker-firebase-storage"]
messaging = ["dep:whisker-firebase-messaging"]

[package.metadata.whisker.plugins.whisker-firebase]
bin = "whisker-firebase-plugin"
protocol = "project"

[[bin]]
name = "whisker-firebase-plugin"
path = "bin/whisker_firebase_plugin.rs"
test = false
bench = false

[dependencies]
whisker-firebase-core = { path = "core", version = "0.1.0" }
whisker-firebase-firestore = { path = "firestore", version = "0.1.0", optional = true }
whisker-firebase-auth = { path = "auth", version = "0.1.0", optional = true }
whisker-firebase-storage = { path = "storage", version = "0.1.0", optional = true }
whisker-firebase-messaging = { path = "messaging", version = "0.1.0", optional = true }
whisker-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
plist = { version = "1.8", default-features = false }

[dev-dependencies]
whisker-cng = { workspace = true }
