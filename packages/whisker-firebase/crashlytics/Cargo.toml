[package]
name = "whisker-firebase-crashlytics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Firebase Crashlytics for Whisker"
include = ["Cargo.toml", "src/**", "bin/**", "Package.swift", "build.gradle.kts", "android/**/*.kt", "ios/**/*.swift"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.plugins.whisker-firebase-crashlytics]
bin = "whisker-firebase-crashlytics-plugin"
protocol = "project"

[[bin]]
name = "whisker-firebase-crashlytics-plugin"
path = "bin/whisker_firebase_crashlytics_plugin.rs"
test = false
bench = false
doc = false

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker = { workspace = true }
whisker-firebase-core = { path = "../core", version = "0.1.0" }
whisker-plugin = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
whisker-cng = { workspace = true }
