[package]
name = "whisker-firebase-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Firebase application initialization for Whisker"
include = ["Cargo.toml", "src/**", "Package.swift", "build.gradle.kts", "android/**/*.kt", "ios/**/*.swift"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker = { path = "../../../crates/whisker", version = "0.15.2" }
serde = { workspace = true }
whisker-plugin = { path = "../../../crates/whisker-plugin", version = "0.15.2" }
anyhow = { workspace = true }
