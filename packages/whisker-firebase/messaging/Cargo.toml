[package]
name = "whisker-firebase-messaging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Firebase Cloud Messaging for Whisker"
include = ["Cargo.toml", "src/**", "bin/**", "Package.swift", "build.gradle.kts", "android/**/*.kt", "android/**/*.xml", "ios/**/*.swift"]

[lib]
crate-type = ["rlib"]

[package.metadata.whisker.plugins.whisker-firebase-messaging]
bin = "whisker-firebase-messaging-plugin"
protocol = "project"

[[bin]]
name = "whisker-firebase-messaging-plugin"
path = "bin/whisker_firebase_messaging_plugin.rs"
test = false
bench = false
doc = false

[package.metadata.whisker.module.platforms]
android = { manifest = "build.gradle.kts" }
ios = { manifest = "Package.swift" }

[dependencies]
whisker = { workspace = true }
whisker-firebase-core = { path = "../core", version = "0.1.0" }
whisker-plugin = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
whisker-cng = { workspace = true }
