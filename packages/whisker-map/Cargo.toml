[package]
name = "whisker-map"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A vector map engine for Whisker that draws MapLibre styles with wgpu."
readme = "../../README.md"

[dependencies]
whisker = { path = "../../crates/whisker", version = "0.19.2" }
whisker-style = { path = "../../crates/whisker-style", version = "0.19.2" }
whisker-surface = { path = "../whisker-surface", version = "0.1.1" }
whisker-wgpu = { path = "../whisker-wgpu", version = "0.1.1" }
glam = "0.30"
bytemuck = { version = "1.25", features = ["derive"] }
serde_json = "1"
earcutr = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers", "WorkerGlobalScope", "Blob", "BlobPropertyBag", "DedicatedWorkerGlobalScope", "Document", "Element", "MessageEvent", "Url", "Worker", "WorkerOptions", "WorkerType", "console"] }

[dev-dependencies]
pollster = "0.4"
